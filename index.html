<style>
:root{
 --void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;
 --line:#2a2934;--line-soft:#1f1e28;
 --cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;
 --brass:#b8974a;--amber:#ff8c00;--ox:#8b1a1a;
 --green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;--knowledge:#3F6C8E;
 --serif:Georgia,'Libre Baskerville',ui-serif,serif;
 --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--brass)}
input[type=number]{font-family:var(--mono)}
a{color:var(--brass)}
a:hover{color:var(--amber)}

.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}
header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}
.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--brass),var(--amber));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--void)}
.brand .name{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:0.02em}
.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}

nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}
nav.tabs button{padding:0 16px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}
nav.tabs button:hover{background:var(--ink);color:var(--cream)}
nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}

.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}
.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}
.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
.tool-btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.tool-btn.primary:hover{background:var(--amber);border-color:var(--amber)}
.tool-btn.t3{border-color:var(--blue);color:var(--blue)}

main{padding:18px 22px 60px;overflow-y:auto;max-width:1240px;margin:0 auto;width:100%}

.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--cream)}
.disclaimer strong{color:var(--brass)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:0.01em}
.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}
.section-h .actions{display:flex;gap:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px;color:var(--cream);letter-spacing:0.01em}
.card h3 .meta{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.1em;margin-left:8px}

.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kpi:last-child{border-bottom:none}
.kpi .l{color:var(--cream-dim)}
.kpi .v{font-family:var(--mono);color:var(--cream);font-weight:500}
.kpi .v.green{color:var(--green)}.kpi .v.red{color:var(--red)}.kpi .v.amber{color:var(--amber)}.kpi .v.brass{color:var(--brass)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.field input,.field select{width:100%}
.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}

.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent;letter-spacing:0.04em;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.btn.primary:hover{background:var(--amber);border-color:var(--amber);color:var(--void)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:11px}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left}
th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
td.r{text-align:right;font-family:var(--mono)}
tr.total td{font-weight:600;border-top:1px solid var(--brass);border-bottom:none;padding-top:10px}
tr.total td.r{color:var(--brass)}

.bar{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;margin:6px 0}
.bar > div{height:100%;background:var(--brass);transition:width 0.3s}
.bar > div.green{background:var(--green)}
.bar > div.red{background:var(--red)}
.bar > div.amber{background:var(--amber)}

.tag.amber{border-color:var(--amber);color:var(--amber)}
.tag.green{border-color:var(--green);color:var(--green)}
.tag.red{border-color:var(--red);color:var(--red)}
.tag.blue{border-color:var(--blue);color:var(--blue)}

.sug.high .prio{color:var(--green)}
.sug.med{border-left-color:var(--amber)}
.sug.med .prio{color:var(--amber)}
.sug.low{border-left-color:var(--cream-dim)}
.sug .why{font-size:11px;color:var(--cream-dim);margin-top:4px;font-style:italic}

.hold-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 32px;gap:6px;padding:7px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.hold-row.head{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.hold-row input,.hold-row select{padding:5px 7px;font-size:12px;width:100%}
.hold-row .x{cursor:pointer;color:var(--cream-muted);font-family:var(--mono);text-align:center}
.hold-row .x:hover{color:var(--red)}

/* MODALS · palette */
.palette-bg,.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:900;backdrop-filter:blur(4px)}
.palette-bg.open,.modal-bg.open{display:flex}
.modal-bg{align-items:center;padding:18px}
.palette{background:var(--void-2);border:1px solid var(--brass);border-radius:5px;width:min(640px,90%);box-shadow:0 18px 50px rgba(0,0,0,0.7);overflow:hidden}
.palette-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.palette-hd .glyph{font-family:var(--serif);font-size:18px;color:var(--brass)}
.palette-hd input{flex:1;border:none;background:transparent;font-size:15px;padding:4px}
.palette-bd{max-height:50vh;overflow:auto;padding:8px}
.palette-row{padding:9px 12px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.palette-row:hover{background:var(--ink)}

.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){nav.tabs button{padding:0 11px;font-size:11px}main{padding:14px 14px 50px}.row{grid-template-columns:1fr}}

    openai:     { label: 'OpenAI Whisper',    models: ['whisper-1'],                      default: 'whisper-1',  type: 'openai_stt' },
  };

  // ─── State ──────────────────────────────────────────────────────────
  const MODALITIES = ['text', 'image', 'video', 'tts', 'stt'];
  const emptyKeys = () => ({ text: {}, image: {}, video: {}, tts: {}, stt: {} });
  /**
   * What a stored config holds, split into what may be stored (the tier, providers, models) and what is held in this
   * tab only (the keys). Keys stay stored only when the owner chose "remember my keys on this device"; a config written
   * the old way (keys stored, no choice made) has its keys moved into the tab and stored no longer. Pure.
   * → { config, secrets, moved } (moved: how many keys were taken out of storage)
   */
  function configFrom(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c) : {};
    if (c.api_key && !c.keys) {   // v1 → v2: one text key at the top level
      c.keys = emptyKeys();
      c.keys.text[c.api_provider || 'anthropic'] = { key: c.api_key, model: c.api_model };
    }
    delete c.api_key;
    const secrets = emptyKeys(), models = emptyKeys();
    let moved = 0;
    for (const m of MODALITIES) {
      const held = c.keys && c.keys[m] && typeof c.keys[m] === 'object' ? c.keys[m] : {};
      for (const pk of Object.keys(held)) {
        const e = held[pk] || {};
        if (typeof e.key === 'string' && e.key) { secrets[m][pk] = e.key; moved++; }
        if (typeof e.model === 'string' && e.model) models[m][pk] = e.model;
      }
      const kept = c.models && c.models[m] && typeof c.models[m] === 'object' ? c.models[m] : {};
      for (const pk of Object.keys(kept)) if (typeof kept[pk] === 'string' && kept[pk]) models[m][pk] = models[m][pk] || kept[pk];
    }
    c.models = models;
    const remember = c.remember_keys === true;
    if (!remember) delete c.keys;
    return { config: c, secrets: secrets, moved: remember ? 0 : moved };
  }
  /** what is written to storage: the config, with the keys only if the owner chose to remember them. Pure. */
  function storedForm(config, secrets) {
    const out = Object.assign({}, config);
    delete out.keys;
    if (config.remember_keys === true) {
      out.keys = emptyKeys();
      for (const m of MODALITIES) for (const pk of Object.keys(secrets[m] || {})) out.keys[m][pk] = { key: secrets[m][pk], model: (config.models && config.models[m] && config.models[m][pk]) || undefined };
    }
    return out;
  }
  const BOOT = (function () {
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); } catch (e) { stored = {}; }
    return configFrom(stored);
  })();
  const STATE = {
    config: BOOT.config,
    secrets: BOOT.secrets,   // the keys: this tab only, unless remember_keys
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null },
    lastUsage: null,
    ask: { opening: null, talk: [], last: null },   // the talk about this page: its opening, kept identical, and its turns
  };

  function saveConfig() { try { localStorage.setItem('fall-kit.config', JSON.stringify(storedForm(STATE.config, STATE.secrets))); } catch (e) {} }
  if (BOOT.moved) saveConfig();   // keys stored the old way leave shared storage now; they stay usable in this tab
  function getKey(modality, providerKey) { return (STATE.secrets[modality] && STATE.secrets[modality][providerKey]) || ''; }
  function getModel(modality, providerKey, registry) {
    return (STATE.config.models && STATE.config.models[modality] && STATE.config.models[modality][providerKey]) || registry[providerKey]?.default;
  }
  function setKey(modality, providerKey, key, model) {
    STATE.secrets[modality] = STATE.secrets[modality] || {};
    if (key) STATE.secrets[modality][providerKey] = key;
    STATE.config.models = STATE.config.models || emptyKeys();
    STATE.config.models[modality] = STATE.config.models[modality] || {};
    if (model) STATE.config.models[modality][providerKey] = model;
    saveConfig();
  }
  function forgetKeys() { STATE.secrets = emptyKeys(); STATE.config.remember_keys = false; saveConfig(); renderAiChip(); }

  // ─── DOM helpers ────────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ────────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }
  function activeTextProvider() { return STATE.config.text_provider || 'anthropic'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      const p = activeTextProvider();
      if (getKey('text', p)) { txt.textContent = 'T3 ' + (TEXT_PROVIDERS[p]?.label.split(' ')[0] || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine; STATE.ai.model = model.id; STATE.ai.ready = true; STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig(); renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;
  }
  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ═══════════════════════ IMAGE · aiImage ═══════════════════════════
  async function aiImage(prompt, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.image_provider || 'fal';
    const p = IMAGE_PROVIDERS[providerKey];
    const key = getKey('image', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('image', providerKey, IMAGE_PROVIDERS);

    if (p.type === 'fal') {
      const r = await fetch('https://fal.run/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Key ' + key },
        body: JSON.stringify({ prompt, image_size: opts.size || 'landscape_4_3', num_inference_steps: opts.steps || 4 }),
      });
      if (!r.ok) throw new Error('fal ' + r.status);
      const j = await r.json();
      return { url: j.images?.[0]?.url || j.image?.url, raw: j };
    }
    if (p.type === 'hf_image') {
      const r = await fetch('https://api-inference.huggingface.co/models/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ inputs: prompt }),
      });
      if (!r.ok) throw new Error('HF ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'replicate') {
      const r = await fetch('https://api.replicate.com/v1/predictions', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Token ' + key, 'Prefer': 'wait' },
        body: JSON.stringify({ version: model, input: { prompt, num_outputs: 1 } }),
      });
      if (!r.ok) throw new Error('Replicate ' + r.status);
      const j = await r.json();
      return { url: Array.isArray(j.output) ? j.output[0] : j.output, raw: j };
    }
    if (p.type === 'openai_image') {
      const r = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1, size: opts.size || '1024x1024' }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'openai_image_compat') {
      const r = await fetch(p.url, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1 }),
      });
      if (!r.ok) throw new Error(p.label + ' ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'google_image') {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':predict?key=' + encodeURIComponent(key), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1 } }),
      });
      if (!r.ok) throw new Error('Google Imagen ' + r.status);
      const j = await r.json();
      return { url: 'data:image/png;base64,' + j.predictions[0].bytesBase64Encoded, raw: j };
    }
    if (p.type === 'ideogram') {
      const r = await fetch('https://api.ideogram.ai/generate', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Api-Key': key },
        body: JSON.stringify({ image_request: { prompt, model, aspect_ratio: opts.size || 'ASPECT_16_9' } }),
      });
      if (!r.ok) throw new Error('Ideogram ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'leonardo') {
      const r = await fetch('https://cloud.leonardo.ai/api/rest/v1/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ prompt, modelId: model, num_images: 1, width: 1024, height: 576 }),
      });
      if (!r.ok) throw new Error('Leonardo ' + r.status);
      const j = await r.json();
      return { id: j.sdGenerationJob.generationId, raw: j, note: 'poll /generations/:id for URL' };
    }
    throw new Error('unknown image provider type: ' + p.type);
  }

  // ═══════════════════════ VIDEO · aiVideo ═══════════════════════════
  async function aiVideo(prompt, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.video_provider || 'fal';
    const p = VIDEO_PROVIDERS[providerKey];
    const key = getKey('video', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('video', providerKey, VIDEO_PROVIDERS);

    if (p.type === 'fal') {
      const r = await fetch('https://fal.run/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Key ' + key },
        body: JSON.stringify({ prompt, duration: opts.duration || '5s', aspect_ratio: opts.aspect || '16:9' }),
      });
      if (!r.ok) throw new Error('fal ' + r.status);

    if (p.type === 'luma') {

      });

      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll /generations/:id for URL' };
    }
    if (p.type === 'runway') {
      const r = await fetch('https://api.dev.runwayml.com/v1/image_to_video', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key, 'X-Runway-Version': '2024-11-06' },
        body: JSON.stringify({ model, promptText: prompt, duration: opts.duration || 5, ratio: opts.aspect || '1280:768' }),
      });
      if (!r.ok) throw new Error('Runway ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for URL' };
    }
    if (p.type === 'pika') {
      const r = await fetch('https://api.pika.art/generate/2.0', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ prompt }),
      });
      if (!r.ok) throw new Error('Pika ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for URL' };
    }
    if (p.type === 'kling') {
      const r = await fetch('https://api.klingai.com/v1/videos/text2video', {

      const j = await r.json();
      return { id: j.data.task_id, raw: j, note: 'poll for URL' };

    throw new Error('unknown video provider type: ' + p.type);
  }

  // ═══════════════════════ TTS · aiTTS ═══════════════════════════════
  async function aiTTS(text, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.tts_provider || 'elevenlabs';
    const p = TTS_PROVIDERS[providerKey];
    const key = getKey('tts', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('tts', providerKey, TTS_PROVIDERS);

    if (p.type === 'elevenlabs') {
      const voice = opts.voice || '21m00Tcm4TlvDq8ikWAM';
      const r = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + voice, {
        method: 'POST', headers: { 'xi-api-key': key, 'content-type': 'application/json' },
        body: JSON.stringify({ text, model_id: model }),
      });
      if (!r.ok) throw new Error('ElevenLabs ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'openai_tts') {
      const r = await fetch('https://api.openai.com/v1/audio/speech', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, input: text, voice: opts.voice || 'alloy' }),
      });
      if (!r.ok) throw new Error('OpenAI TTS ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'cartesia') {
      const r = await fetch('https://api.cartesia.ai/tts/bytes', {
        method: 'POST', headers: { 'content-type': 'application/json', 'X-API-Key': key, 'Cartesia-Version': '2024-11-13' },
        body: JSON.stringify({ model_id: model, transcript: text, voice: { mode: 'id', id: opts.voice || 'a0e99841-438c-4a64-b679-ae501e7d6091' }, output_format: { container: 'mp3', encoding: 'mp3', sample_rate: 44100 } }),
      });
      if (!r.ok) throw new Error('Cartesia ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'playht') {
      const r = await fetch('https://api.play.ht/api/v2/tts/stream', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key, 'X-USER-ID': opts.userId || '' },
        body: JSON.stringify({ text, voice: opts.voice || 's3://voice-cloning-zero-shot/d9ff78ba-d016-47f6-b0ef-dd630f59414e/female-cs/manifest.json', voice_engine: model }),
      });
      if (!r.ok) throw new Error('PlayHT ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    throw new Error('unknown TTS provider type: ' + p.type);
  }

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }

function adjustedPersonalAllowance(income){
 // PA tapers by £1 for every £2 over £100k, fully exhausted at £125,140

function incomeTax(income){
 // Returns { tax, bands: [{rate, amount, tax}], paUsed, marginalRate }

 let remaining=Math.max(0,income-pa);

 let tax=0;
 // basic rate band
 const basic=Math.min(remaining,RULES.basicRateBand);
 if(basic>0){tax+=basic*RULES.basicRate;bands.push({label:'Basic 20%',rate:RULES.basicRate,amount:basic,tax:basic*RULES.basicRate});remaining-=basic}
 // higher rate band
 const higherBandSize=RULES.additionalRateStart-RULES.higherRateStart;

 if(higher>0){tax+=higher*RULES.higherRate;bands.push({label:'Higher 40%',rate:RULES.higherRate,amount:higher,tax:higher*RULES.higherRate});remaining-=higher}
 // additional rate
 if(remaining>0){tax+=remaining*RULES.additionalRate;bands.push({label:'Additional 45%',rate:RULES.additionalRate,amount:remaining,tax:remaining*RULES.additionalRate})}
 // marginal rate
 let marginalRate=0;
 if(income<=pa)marginalRate=0;
 else if(income<=RULES.higherRateStart)marginalRate=RULES.basicRate;
 else if(income<=RULES.additionalRateStart)marginalRate=RULES.higherRate;
 else marginalRate=RULES.additionalRate;
 // PA taper zone has effective marginal 60%
 if(income>RULES.paTaperStart&&income<=125140)marginalRate=0.60;
 return{tax,bands,paUsed:pa,marginalRate}
}

 // Employee Class 1 NI (employed, monthly UK PAYE)

}

 if(years<=0)return currentPot;

 return fvPot+fvContribs;
}

const TAX_WRAPPERS = {
 isa_ss: { label: 'S&S ISA' },
 isa_cash: { label: 'Cash ISA' },
 isa_lisa: { label: 'LISA' },
 isa_if: { label: 'IFISA' },
 sipp: { label: 'SIPP' },
 workplace: { label: 'Workplace pension' },
 gia: { label: 'GIA (taxable)' },
 premium: { label: 'Premium Bonds' },
 bank: { label: 'Bank account' },
 other: { label: 'Other' },
};
const RISK_PROFILES = {
 cautious: { eq: 0.20, bond: 0.60, cash: 0.20, label: 'Cautious' },
 balanced: { eq: 0.50, bond: 0.40, cash: 0.10, label: 'Balanced' },
 adventurous: { eq: 0.75, bond: 0.20, cash: 0.05, label: 'Adventurous' },
 aggressive: { eq: 0.90, bond: 0.05, cash: 0.05, label: 'Aggressive' },
};

function portfolioAnalysis(){
 const h=state.holdings;
 const total=h.reduce((s,x)=>s+(+x.value||0),0);
 if(!total)return{total:0,byClass:{},byWrapper:{},riskScore:0,equity:0,bond:0,cash:0,concentration:[],target:RISK_PROFILES[state.profile.riskProfile]||RISK_PROFILES.balanced};
 const byClass={},byWrapper={};let riskWeighted=0;
 for(const x of h){
 const v=+x.value||0;
 byClass[x.assetClass]=(byClass[x.assetClass]||0)+v;
 byWrapper[x.taxWrapper]=(byWrapper[x.taxWrapper]||0)+v;
 riskWeighted+=v*(ASSET_CLASSES[x.assetClass]?.risk||2);
 }
 const riskScore=total>0?riskWeighted/total:0;
 // bucket into equity/bond/cash for target comparison
 const equity=(byClass.equity||0)+(byClass.fund||0)+(byClass.reit||0)+(byClass.crypto||0);
 const bond=(byClass.bond||0);
 const cash=(byClass.cash||0)+(byClass.premium||0);
 // concentration: any single holding > 10% of total
 const concentration=h.filter(x=>(+x.value||0)/total>0.10).map(x=>({label:x.label,pct:(+x.value||0)/total}));
 return{total,byClass,byWrapper,riskScore,equity:equity/total,bond:bond/total,cash:cash/total,concentration,target:RISK_PROFILES[state.profile.riskProfile]||RISK_PROFILES.balanced}
}

function generateSuggestions(){
 const p=state.profile,c=state.contribs;
 const tax=totalTax();
 const out=[];

 // ISA allowance use
 const isaUsed=(+c.isaThisYear||0)+(+c.lisaThisYear||0);
 const isaLeft=RULES.isaAllowance-isaUsed;
 if(isaLeft>0&&isaLeft<5000)out.push({prio:'med',title:`Use remaining ISA allowance · £${fmt(isaLeft)}`,why:`The £${fmt(RULES.isaAllowance)} ISA allowance resets every 6 April. Unused allowance is lost.`});
 else if(isaLeft>=5000)out.push({prio:'high',title:`Big ISA allowance unused · £${fmt(isaLeft)} of £${fmt(RULES.isaAllowance)}`,why:`Tax-free growth and withdrawals. If you have spare cash earning <4% in a bank, an ISA is likely a better home.`});

 // LISA (under 50)
 if(p.age<50){
 const lisaLeft=RULES.lisaAllowance-(+c.lisaThisYear||0);
 if(lisaLeft>0)out.push({prio:'med',title:`LISA bonus available · 25% gov match on £${fmt(lisaLeft)}`,why:`Up to £${fmt(RULES.lisaAllowance)}/yr earns ${pct(RULES.lisaBonusPct)} gov bonus (max £1,000). First-home or age 60+ access · 25% penalty otherwise.`});
 }

 // Higher-rate taxpayer · SIPP for relief
 if(p.income>RULES.higherRateStart){
 const reliefRate=tax.marginalRate;
 out.push({prio:'high',title:`Higher-rate · SIPP gets ${pct(reliefRate)} tax relief`,why:`At your marginal rate (${pct(reliefRate)}), £1,000 net into a pension reduces your tax bill by £${fmt(1000*reliefRate/(1-reliefRate))}. Worth claiming if you're in the higher band.`});
 }

 // 60% trap (PA taper zone)
 if(p.income>RULES.paTaperStart&&p.income<=125140){
 const intoZone=p.income-RULES.paTaperStart;
 out.push({prio:'high',title:`60% effective tax trap · £${fmt(intoZone)} in the taper zone`,why:`Between £100k-£125,140 you lose £1 of personal allowance per £2 earned · creating a 60% marginal rate. Pension contribution that drops your adjusted income below £100k recovers the full PA.`});
 }

 // Pension annual allowance
 const pensionUsed=(+c.sippThisYear||0)+(+c.workplacePensionAnnual||0)+(+c.salarySacrifice||0);
 const pensionLeft=RULES.pensionAnnualAllowance-pensionUsed;
 if(pensionLeft<5000&&pensionLeft>0)out.push({prio:'low',title:`Approaching pension annual allowance · £${fmt(pensionLeft)} left of £${fmt(RULES.pensionAnnualAllowance)}`,why:`Contributions above £${fmt(RULES.pensionAnnualAllowance)} (gross) are taxed at your marginal rate. Carry-forward from previous 3 years may apply.`});

 // CGT allowance
 const cgtLeft=RULES.cgtAllowance-state.gains.cgtRealisedThisYear;
 if(cgtLeft>0&&state.gains.cgtRealisedThisYear===0)out.push({prio:'low',title:`CGT allowance unused · £${fmt(RULES.cgtAllowance)}`,why:`Annual CGT allowance is small (£${fmt(RULES.cgtAllowance)} for 2025-26). Consider Bed & ISA for non-wrapped gains to use it.`});

 // Emergency fund
 const efTarget=p.monthlyExpenses*p.emergencyFundMonths;
 const cashHoldings=state.holdings.filter(h=>h.assetClass==='cash'||h.taxWrapper==='bank'||h.taxWrapper==='isa_cash').reduce((s,h)=>s+(+h.value||0),0);
 if(cashHoldings<efTarget){
 out.push({prio:efTarget-cashHoldings>5000?'high':'med',title:`Emergency fund short · ${money(cashHoldings)} of ${money(efTarget)} target`,why:`Rule of thumb: ${p.emergencyFundMonths} months of essentials (£${fmt(p.monthlyExpenses)}/mo). Easy-access cash ISA / NS&I are typical homes. Top this up before optimising for growth.`});
 }

 // Workplace pension match
 if(p.employerContribPct>0){
 const employerMatch=p.income*p.employerContribPct;
 out.push({prio:'med',title:`Capture full employer match · ${pct(p.employerContribPct)} = ${money(employerMatch)}/yr`,why:`Employer matches are free money. Always contribute at least to match the maximum employer top-up before SIPP.`});
 }

 // Portfolio alignment
 const pa=portfolioAnalysis();
 if(pa.total>1000){
 const target=pa.target;
 const eqGap=pa.equity-target.eq;
 if(Math.abs(eqGap)>0.10){
 out.push({prio:Math.abs(eqGap)>0.20?'med':'low',title:`Portfolio drift · equity ${pct(pa.equity)} vs target ${pct(target.eq)} (${target.label})`,why:`Your risk profile suggests ${pct(target.eq)} equity. You are ${eqGap>0?'overweight':'underweight'} by ${pct(Math.abs(eqGap))}. Rebalance via new contributions to avoid CGT.`});
 }
 pa.concentration.forEach(c=>{
 if(c.pct>0.20)out.push({prio:'med',title:`Concentration risk · ${esc(c.label)} is ${pct(c.pct)} of portfolio`,why:`Single-position risk above 20% means a 50% drop on that line reduces total portfolio by ${pct(c.pct*0.5)}. Consider trimming.`});
 });
 }

 // State pension qualifying years
 if(p.qualifyingYearsNI<RULES.statePensionQualifyingYears){
 const yearsShort=RULES.statePensionQualifyingYears-p.qualifyingYearsNI;
 const yearlyImpact=RULES.statePensionAnnual*(yearsShort/RULES.statePensionQualifyingYears);
 out.push({prio:'med',title:`State pension short by ${yearsShort} years · ${money(yearlyImpact)}/yr at risk`,why:`Full state pension (${money(RULES.statePensionAnnual)}/yr) needs ${RULES.statePensionQualifyingYears} qualifying NI years. Each missing year ≈ ${money(RULES.statePensionAnnual/RULES.statePensionQualifyingYears)}/yr lost. Buy back via voluntary Class 3 NI if shortfall is recent.`});
 }

 // Income-relative checks
 if(p.income>0&&p.monthlyExpenses*12>p.income*0.8){
 out.push({prio:'med',title:`Spending is high relative to income`,why:`Annual outgoings (${money(p.monthlyExpenses*12)}) are ${pct(p.monthlyExpenses*12/p.income)} of income. Difficult to invest meaningfully above 80%. Identify one optimisable category.`});
 }

 return out.sort((a,b)=>({high:0,med:1,low:2})[a.prio]-({high:0,med:1,low:2})[b.prio])
}

async function answerQuestion(q){
 // T0 first
 for(const pat of T0_PATTERNS){if(pat.match.test(q))return{src:'T0 · UK rules engine ('+TAX_YEAR+')',text:pat.answer(q)}}
 // T3 with full context
 const tier=await Cascade.detectTier();
 if(tier!=='T0'){
 const ctx=buildContext();
 const sys=`You are FallAdviser, a UK financial-advice tool. **You are informational only — not regulated FCA advice.** Always say so.

The user's profile:
${ctx}

Be concrete · cite £ amounts using their numbers · use UK terms · short paragraphs · always end with "Verify with HMRC or an authorised adviser before acting."`;
 const r=await Cascade.generate(sys,q,1400);
 if(r.text)return{src:r.tier,text:r.text}
 }
 return{src:'T0 · fallback',text:`I don't have a specific answer for that question in my rule engine. Add an Anthropic / Gemini / OpenAI key in Settings (Gemini is free) to enable smart Q&A grounded in your profile.\n\nIn the meantime, try one of these supported topics:\n- "ISA vs SIPP"\n- "CGT on £15,000 sale"\n- "State pension qualifying years"\n- "60% tax trap / personal allowance"\n- Or check the Tax, Pension, Portfolio tabs.`}

}

 state.chat.push({role:'bot',text:ans.text,src:ans.src});
 saveAll();$('#chat').innerHTML=renderChat();$('#chat').scrollTop=$('#chat').scrollHeight;
}

 <p style="font-size:13px;color:var(--cream-dim);margin-bottom:12px">${state.audit.length} entries in chain · prevHash + docHash + reasoning · download for compliance review.</p>
 <button class="btn" onclick="exportAuditChain()">↓ audit-chain.json</button>
 <button class="btn sm" onclick="state.settings.auditChain=!state.settings.auditChain;saveAll();render()">${state.settings.auditChain?'disable':'enable'} chain</button>
 </div>
 </div>
 `;
}
function downloadFile(name,content,mime){const blob=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

Generated: ${new Date().toISOString().slice(0,16).replace('T',' ')}`;
 if(fmtType==='pdf'){
 // postMessage to fallpdf
 const ok=window.opener||window.parent;
 const target=document.querySelector('iframe[src*="fallpdf"]');
 if(target){target.contentWindow.postMessage({target:'fallpdf',action:'setSource',source:md,source_id:'falladviser'},'*');toast('sent to FallPDF')}
 else{downloadFile('tax-summary-'+TAX_YEAR+'.md',md,'text/markdown');toast('FallPDF not detected · downloaded .md instead')}
 }else{
 downloadFile('tax-summary-'+TAX_YEAR+'.md',md,'text/markdown');toast('exported')
 }
}
function exportPortfolioCSV(){
 const rows=[['label','value','asset_class','tax_wrapper','cost_basis']];
 state.holdings.forEach(h=>rows.push([h.label||'',h.value||0,ASSET_CLASSES[h.assetClass]?.label||h.assetClass,TAX_WRAPPERS[h.taxWrapper]?.label||h.taxWrapper,h.costBasis||0]));
 const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
 downloadFile('holdings.csv',csv,'text/csv');toast('exported')
}
function exportFullState(){
 const e={schema:'falladviser@'+VERSION,exported:new Date().toISOString(),tax_year:TAX_YEAR,profile:state.profile,contribs:state.contribs,holdings:state.holdings,gains:state.gains,settings:{...state.settings,anthropicKey:'',openaiKey:'',geminiKey:'',openrouterKey:''}};
 downloadFile('falladviser-state-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(e,null,2),'application/json');toast('exported (keys stripped)')
}
function exportAuditChain(){
 downloadFile('audit-chain-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({schema:'falladviser-audit@1',exported:new Date().toISOString(),entries:state.audit},null,2),'application/json');toast('audit chain exported')
}
function importState(){
 const i=document.createElement('input');i.type='file';i.accept='.json';
 i.onchange=async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text();try{const d=JSON.parse(text);if(!confirm('replace local profile + holdings with imported data?'))return;state.profile=Object.assign({},state.profile,d.profile||{});state.contribs=Object.assign({},state.contribs,d.contribs||{});state.holdings=d.holdings||[];state.gains=Object.assign({},state.gains,d.gains||{});saveAll();render();toast('imported')}catch(err){alert('invalid JSON: '+err.message)}};
 i.click()
}

function openPalette(){$('#palette').classList.add('open');setTimeout(()=>$('#pInput').focus(),50);renderPaletteSuggestions('')}
function closePalette(){$('#palette').classList.remove('open');$('#pInput').value=''}
function renderPaletteSuggestions(q){
 const body=$('#pBody');
 if(!q.trim()){
 body.innerHTML=`
 <div class="palette-row" onclick="askPalette('ISA vs SIPP for my profile')"><div>£</div><div>ISA vs SIPP for my profile</div></div>
 <div class="palette-row" onclick="askPalette('60% tax trap if I earn over 100k')"><div>£</div><div>60% tax trap above £100k</div></div>
 <div class="palette-row" onclick="askPalette('CGT on selling £20,000 of shares')"><div>£</div><div>CGT on a £20k share sale</div></div>
 <div class="palette-row" onclick="askPalette('State pension qualifying years top up worth it?')"><div>£</div><div>State pension top-up</div></div>
 <div class="palette-row" onclick="showApp('dashboard');closePalette()"><div>◐</div><div>open Dashboard</div></div>
 <div class="palette-row" onclick="showApp('qa');closePalette()"><div>?</div><div>open full Q&A</div></div>
 <div style="padding:10px 12px;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;border-top:1px dashed var(--line);margin-top:6px">or type any UK-finance question</div>
 `;return;
 }
 body.innerHTML=`<div class="palette-row" onclick="askPalette('${esc(q.replace(/'/g,"\\'"))}')"><div>£</div><div>ask: ${esc(q.slice(0,80))}</div></div>`;
}
async function askPalette(q){
 closePalette();
 state.active='qa';
 if(!state.chat)state.chat=[];
 state.chat.push({role:'user',text:q});
 saveAll();render();
 $('#chat').innerHTML=renderChat()+`<div class="msg bot"><em style="color:var(--cream-muted)">thinking…</em></div>`;
 $('#chat').scrollTop=$('#chat').scrollHeight;
 const ans=await answerQuestion(q);
 state.chat.push({role:'bot',text:ans.text,src:ans.src});
 saveAll();
 if(state.active==='qa'){$('#chat').innerHTML=renderChat();$('#chat').scrollTop=$('#chat').scrollHeight}
}

function openModal(kind,arg){
 if(kind==='settings'){
 $('#modalTitle').textContent='Settings · cascade keys + audit';
 $('#modalBody').innerHTML=`
 <p style="color:var(--cream-dim);font-size:12px;margin-bottom:10px">FallAdviser works fully offline with rules-based answers (T0). For nuanced Q&A grounded in your profile, add an API key below. <a href="https://aistudio.google.com/apikey" target="_blank">Gemini is free</a>. Keys stay on this device.</p>
 <div class="field"><label>anthropic · claude</label><input id="stAnth" type="password" value="${esc(state.settings.anthropicKey)}" placeholder="sk-ant-…"></div>
 <div class="field"><label>gemini · free</label><input id="stGem" type="password" value="${esc(state.settings.geminiKey)}"></div>
 <div class="field"><label>openai · gpt</label><input id="stOAI" type="password" value="${esc(state.settings.openaiKey)}"></div>
 <div class="field"><label>openrouter</label><input id="stOR" type="password" value="${esc(state.settings.openrouterKey)}"></div>
 <div class="field"><label><input type="checkbox" id="stAud" ${state.settings.auditChain?'checked':''}> P3 audit chain · prevHash on every save</label></div>
 <div style="margin-top:14px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em">FallAdviser v${VERSION} · prime ${PRIME} · UK ${TAX_YEAR} · ◊·κ=1 · MIT</div>
 <div class="actions"><button class="btn" onclick="closeModal()">cancel</button><button class="btn primary" onclick="saveSettings()">save</button></div>
 `;
 }else if(kind==='rebalance'){
 const{gap,target,pa}=arg;
 $('#modalTitle').textContent='Rebalance suggestion';
 $('#modalBody').innerHTML=`
 <p>Target: <strong>${target.label}</strong> · ${pct(target.eq)} equity / ${pct(target.bond)} bonds / ${pct(target.cash)} cash</p>
 <p>Current: ${pct(pa.equity)} eq / ${pct(pa.bond)} bond / ${pct(pa.cash)} cash · total ${money(pa.total)}</p>
 <hr style="margin:12px 0;border:none;border-top:1px solid var(--line)">
 <p>To reach target equity:</p>
 <ul style="margin:8px 0 12px 22px;font-size:13px;line-height:1.7">
 <li>${gap>0?`Add ${money(gap)} equity (or sell ${money(-gap*0.5)} bonds and rebuy equity).`:`Reduce equity by ${money(-gap)} · prefer adding to bonds/cash via fresh contributions to avoid CGT.`}</li>
 <li>Use ISA/SIPP wrappers for the rebalance to defer any CGT.</li>
 <li>Spread changes over 2-3 months if the gap is large (cost averaging).</li>
 </ul>
 <p style="font-size:11px;color:var(--cream-muted)">Rebalancing via new contributions is tax-efficient. Selling within a GIA can trigger CGT — use your £${fmt(RULES.cgtAllowance)} allowance.</p>
 <div class="actions"><button class="btn primary" onclick="closeModal()">got it</button></div>
 `;
 }
 $('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open')}
function saveSettings(){state.settings.anthropicKey=$('#stAnth').value;state.settings.geminiKey=$('#stGem').value;state.settings.openaiKey=$('#stOAI').value;state.settings.openrouterKey=$('#stOR').value;state.settings.auditChain=$('#stAud').checked;Cascade._p=undefined;saveAll();updateTierBadge();closeModal();toast('saved')}

// ── keyboard ──
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openPalette()}
 if(e.key==='Escape'){closePalette();closeModal()}
 if($('#palette').classList.contains('open')&&e.key==='Enter'){e.preventDefault();const q=$('#pInput').value.trim();if(q)askPalette(q)}
});
document.addEventListener('input',e=>{if(e.target.id==='pInput')renderPaletteSuggestions(e.target.value)});
document.addEventListener('click',e=>{if(e.target.id==='palette')closePalette();if(e.target.id==='modal')closeModal()});

// ── ESTATE-AWARE · pull fall-registry on boot ──
async function loadEstateContext(){
 try{
 const res=await fetch('https://raw.githubusercontent.com/sjgant80-hub/fall-registry/main/index.json',{cache:'no-cache'});
 if(res.ok){const d=await res.json();state.estate={tools:(d.apps||[]).map(a=>({name:a.name,purpose:a.purpose,url:a.url,prime:a.prime})),version:d.registryVersion}}
 }catch(e){/* offline fine */}
}

// ── KONOMI sovereign tier (inert) ──
window.KONOMI={active:true,tier:'sovereign',prime:PRIME,check:()=>({ok:true,tier:'sovereign'})};

// ── FALLMESH ──
try{const sig=new BroadcastChannel('fall-signal');sig.postMessage({source:'falladviser',type:'hello',prime:PRIME,version:VERSION,ts:Date.now()});sig.addEventListener('message',async e=>{const m=e.data;if(!m)return;if(m.type==='ping')sig.postMessage({source:'falladviser',type:'pong',prime:PRIME});if(m.source==='si-didy'&&m.type==='query'&&m.intent){const ans=await answerQuestion(m.intent);sig.postMessage({source:'falladviser',type:'answer',replyTo:m.id,text:ans.text})}})}catch(e){}

// ── postMessage API · si-didy integration ──
window.addEventListener('message',async e=>{const m=e.data;if(!m||m.target!=='falladviser'||!m.action)return;let r=null;
 if(m.action==='ping')r={ok:true,prime:PRIME,version:VERSION,taxYear:TAX_YEAR};
 else if(m.action==='ask'&&m.question){const a=await answerQuestion(m.question);r={ok:true,answer:a.text,src:a.src}}
 else if(m.action==='get-tax')r={ok:true,tax:totalTax(),rules:RULES};
 else if(m.action==='get-portfolio')r={ok:true,portfolio:portfolioAnalysis(),holdings:state.holdings};
 else if(m.action==='get-suggestions')r={ok:true,suggestions:generateSuggestions()};
 else if(m.action==='get-profile')r={ok:true,profile:state.profile};
 else if(m.action==='set-profile'&&m.profile){state.profile=Object.assign({},state.profile,m.profile);saveAll();r={ok:true}}
 e.source?.postMessage({target:m.source||'*',responseTo:m.action,data:r},'*')});

// ── boot ──
(async function(){await openDB();await loadAll();await updateTierBadge();await loadEstateContext();if(!state.active||!TABS.find(t=>t.id===state.active))state.active='dashboard';render();})();
</script>
